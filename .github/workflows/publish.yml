# SPDX-License-Identifier: GPL-3.0-or-later

name: Publish LoFiBox APT Repository

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Immutable LoFiBox-Zero ref to package, preferably a release tag such as v0.2.1."
        required: true
      expected_upstream_version:
        description: "Optional upstream version guard, for example 0.2.1."
        required: false
        default: ""
      suite:
        description: "APT suite to publish."
        required: true
        default: "trixie"
      preview_suffix:
        description: "Debian preview suffix. Use auto for ~lofibox<run_number>.<run_attempt>."
        required: true
        default: "auto"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ inputs.suite }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve Release Version
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.version.outputs.source_sha }}
      upstream_version: ${{ steps.version.outputs.upstream_version }}
      debian_base_version: ${{ steps.version.outputs.debian_base_version }}
      preview_suffix: ${{ steps.version.outputs.preview_suffix }}
      preview_version: ${{ steps.version.outputs.preview_version }}
      suite: ${{ steps.version.outputs.suite }}

    steps:
      - name: Check Out APT Repository
        uses: actions/checkout@v4
        with:
          path: lofibox-apt

      - name: Check Out LoFiBox-Zero
        uses: actions/checkout@v4
        with:
          repository: vicliu624/LoFiBox-Zero
          ref: ${{ inputs.source_ref }}
          path: LoFiBox-Zero

      - name: Install Version Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev

      - name: Resolve Preview Version
        id: version
        run: |
          chmod +x lofibox-apt/scripts/ci/*.sh
          lofibox-apt/scripts/ci/resolve-preview-version.sh \
            --source-dir LoFiBox-Zero \
            --expected-upstream-version "${{ inputs.expected_upstream_version }}" \
            --preview-suffix "${{ inputs.preview_suffix }}" \
            --suite "${{ inputs.suite }}" \
            --github-output "$GITHUB_OUTPUT"

  build-amd64-package:
    name: Build Debian package (amd64)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check Out APT Repository
        uses: actions/checkout@v4
        with:
          path: lofibox-apt

      - name: Check Out LoFiBox-Zero
        uses: actions/checkout@v4
        with:
          repository: vicliu624/LoFiBox-Zero
          ref: ${{ inputs.source_ref }}
          path: LoFiBox-Zero

      - name: Verify Source Commit
        run: test "$(git -C LoFiBox-Zero rev-parse HEAD)" = "${{ needs.prepare.outputs.source_sha }}"

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apt-utils \
            autopkgtest \
            build-essential \
            cmake \
            debhelper-compat \
            desktop-file-utils \
            devscripts \
            dpkg-dev \
            libdistro-info-perl \
            libfreetype-dev \
            libx11-dev \
            libxkbcommon-dev \
            lintian \
            ninja-build \
            pkgconf \
            python3

      - name: Apply Preview Version
        run: |
          chmod +x lofibox-apt/scripts/ci/*.sh
          lofibox-apt/scripts/ci/apply-preview-version.sh \
            --source-dir LoFiBox-Zero \
            --preview-version "${{ needs.prepare.outputs.preview_version }}" \
            --suite "${{ needs.prepare.outputs.suite }}"

      - name: Build Package
        working-directory: LoFiBox-Zero
        run: |
          chmod +x debian/rules debian/tests/smoke
          export LOFIBOX_EXTRA_CMAKE_ARGS="${LOFIBOX_EXTRA_CMAKE_ARGS:+$LOFIBOX_EXTRA_CMAKE_ARGS }-DLOFIBOX_BUILD_WEBUI=ON"
          dpkg-buildpackage -us -uc -b

      - name: Collect Package Artifacts
        run: |
          lofibox-apt/scripts/ci/collect-debian-artifacts.sh \
            --arch amd64 \
            --source-dir LoFiBox-Zero \
            --output-dir package-artifacts \
            --expected-version "${{ needs.prepare.outputs.preview_version }}" \
            --env-file "$GITHUB_ENV"

      - name: Run Lintian
        run: lintian --profile debian "$LOFIBOX_CHANGES"

      - name: Run Autopkgtest Smoke
        run: sudo autopkgtest "$LOFIBOX_CHANGES" "$GITHUB_WORKSPACE/LoFiBox-Zero" -- null

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package-amd64
          if-no-files-found: error
          path: package-artifacts/*

  build-arm64-package:
    name: Build Debian package (arm64)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check Out APT Repository
        uses: actions/checkout@v4
        with:
          path: lofibox-apt

      - name: Check Out LoFiBox-Zero
        uses: actions/checkout@v4
        with:
          repository: vicliu624/LoFiBox-Zero
          ref: ${{ inputs.source_ref }}
          path: LoFiBox-Zero

      - name: Verify Source Commit
        run: test "$(git -C LoFiBox-Zero rev-parse HEAD)" = "${{ needs.prepare.outputs.source_sha }}"

      - name: Install arm64 Cross Build Tools
        run: |
          sudo dpkg --add-architecture arm64
          runner_codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          sudo rm -f /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list
          sudo truncate -s 0 /etc/apt/sources.list
          cat >/tmp/ubuntu-amd64.sources <<EOF
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu
          Suites: ${runner_codename} ${runner_codename}-updates ${runner_codename}-backports
          Components: main universe
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu
          Suites: ${runner_codename}-security
          Components: main universe
          Architectures: amd64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          cat >/tmp/ubuntu-ports-arm64.sources <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: ${runner_codename} ${runner_codename}-updates ${runner_codename}-backports
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: ${runner_codename}-security
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo mv /tmp/ubuntu-amd64.sources /etc/apt/sources.list.d/ubuntu-amd64.sources
          sudo mv /tmp/ubuntu-ports-arm64.sources /etc/apt/sources.list.d/ubuntu-ports-arm64.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apt-utils \
            binutils-aarch64-linux-gnu \
            build-essential \
            cmake \
            crossbuild-essential-arm64 \
            debhelper-compat \
            desktop-file-utils \
            devscripts \
            dpkg-dev \
            libdistro-info-perl \
            libfreetype-dev:arm64 \
            libstdc++6:arm64 \
            libx11-dev:arm64 \
            libxkbcommon-dev:arm64 \
            lintian \
            ninja-build \
            pkgconf \
            python3

      - name: Apply Preview Version
        run: |
          chmod +x lofibox-apt/scripts/ci/*.sh
          lofibox-apt/scripts/ci/apply-preview-version.sh \
            --source-dir LoFiBox-Zero \
            --preview-version "${{ needs.prepare.outputs.preview_version }}" \
            --suite "${{ needs.prepare.outputs.suite }}"

      - name: Build arm64 Package
        working-directory: LoFiBox-Zero
        run: |
          chmod +x debian/rules debian/tests/smoke
          sed -i 's/^ pkgconf$/ pkgconf:native/' debian/control
          export DEB_BUILD_OPTIONS="${DEB_BUILD_OPTIONS:+$DEB_BUILD_OPTIONS }nocheck"
          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++
          export PKG_CONFIG_LIBDIR="/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
          export LOFIBOX_EXTRA_CMAKE_ARGS="${LOFIBOX_EXTRA_CMAKE_ARGS:+$LOFIBOX_EXTRA_CMAKE_ARGS }-DLOFIBOX_BUILD_WEBUI=ON"
          dpkg-buildpackage --host-arch=arm64 -us -uc -b

      - name: Collect Package Artifacts
        run: |
          lofibox-apt/scripts/ci/collect-debian-artifacts.sh \
            --arch arm64 \
            --source-dir LoFiBox-Zero \
            --output-dir package-artifacts \
            --expected-version "${{ needs.prepare.outputs.preview_version }}" \
            --env-file "$GITHUB_ENV"

      - name: Run Lintian
        run: lintian --profile debian "$LOFIBOX_CHANGES"

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package-arm64
          if-no-files-found: error
          path: package-artifacts/*

  build-raspi-armhf-package:
    name: Build Debian package (armhf, Raspberry Pi ARMv6)
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check Out APT Repository
        uses: actions/checkout@v4
        with:
          path: lofibox-apt

      - name: Check Out LoFiBox-Zero
        uses: actions/checkout@v4
        with:
          repository: vicliu624/LoFiBox-Zero
          ref: ${{ inputs.source_ref }}
          path: LoFiBox-Zero

      - name: Verify Source Commit
        run: test "$(git -C LoFiBox-Zero rev-parse HEAD)" = "${{ needs.prepare.outputs.source_sha }}"

      - name: Install Raspberry Pi ARMv6 Chroot Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binfmt-support \
            ca-certificates \
            curl \
            debootstrap \
            gnupg \
            qemu-user-static

      - name: Build Raspberry Pi ARMv6 Package
        env:
          PREVIEW_VERSION: ${{ needs.prepare.outputs.preview_version }}
          APT_SUITE: ${{ needs.prepare.outputs.suite }}
        run: |
          set -euxo pipefail

          root="$RUNNER_TEMP/raspbian-armhf-root"
          sudo rm -rf "$root"

          curl -fsSL http://archive.raspbian.org/raspbian.public.key -o "$RUNNER_TEMP/raspbian.public.key"
          gpg --dearmor --yes -o "$RUNNER_TEMP/raspbian-archive-keyring.gpg" "$RUNNER_TEMP/raspbian.public.key"
          sudo debootstrap \
            --arch=armhf \
            --foreign \
            --keyring="$RUNNER_TEMP/raspbian-archive-keyring.gpg" \
            bookworm \
            "$root" \
            http://archive.raspbian.org/raspbian
          sudo cp /usr/bin/qemu-arm-static "$root/usr/bin/"
          sudo chroot "$root" /debootstrap/debootstrap --second-stage

          sudo mount -t proc proc "$root/proc"
          sudo mount --bind /sys "$root/sys"
          sudo mount --bind /dev "$root/dev"
          trap 'sudo umount -R "$root/proc" || true; sudo umount -R "$root/sys" || true; sudo umount -R "$root/dev" || true' EXIT

          sudo chroot "$root" /bin/bash -lc '
            set -euxo pipefail
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends \
              apt-utils \
              binutils \
              build-essential \
              ca-certificates \
              cmake \
              debhelper-compat \
              desktop-file-utils \
              devscripts \
              dpkg-dev \
              libdistro-info-perl \
              libfreetype-dev \
              libx11-dev \
              libxkbcommon-dev \
              lintian \
              ninja-build \
              pkgconf \
              python3
          '

          sudo mkdir -p "$root/work/LoFiBox-Zero"
          tar \
            --exclude=.git \
            --exclude=.cache \
            --exclude=.tmp \
            --exclude=build \
            --exclude=obj-* \
            --exclude=out \
            --exclude=runs \
            -C "$GITHUB_WORKSPACE/LoFiBox-Zero" \
            -cf - . | sudo tar -C "$root/work/LoFiBox-Zero" -xf -

          sudo tee "$root/work/build-armhf.sh" >/dev/null <<EOF
          #!/bin/bash
          set -euxo pipefail
          cd /work/LoFiBox-Zero
          export DEBIAN_FRONTEND=noninteractive
          export DEBEMAIL=maintainers@example.invalid
          export DEBFULLNAME="LoFiBox contributors"
          dch -b --newversion "$PREVIEW_VERSION" --distribution unstable "Preview APT repository build for $APT_SUITE."
          test "\$(dpkg-parsechangelog -S Version)" = "$PREVIEW_VERSION"

          chmod +x debian/rules debian/tests/smoke
          export DEB_BUILD_OPTIONS="\${DEB_BUILD_OPTIONS:+\$DEB_BUILD_OPTIONS }nocheck"
          export LOFIBOX_EXTRA_CMAKE_ARGS="\${LOFIBOX_EXTRA_CMAKE_ARGS:+\$LOFIBOX_EXTRA_CMAKE_ARGS }-DLOFIBOX_BUILD_WEBUI=ON"
          dpkg-buildpackage -us -uc -b

          changes_file="\$(find /work -maxdepth 1 -name "lofibox_*_armhf.changes" -print -quit)"
          test -n "\$changes_file"
          test -s "\$changes_file"
          lintian --profile debian "\$changes_file"

          deb_file="\$(find /work -maxdepth 1 -name "lofibox_*_armhf.deb" -print -quit)"
          test -n "\$deb_file"
          test "\$(dpkg-deb -f "\$deb_file" Architecture)" = "armhf"
          test "\$(dpkg-deb -f "\$deb_file" Version)" = "$PREVIEW_VERSION"
          tmp_dir="\$(mktemp -d)"
          dpkg-deb -x "\$deb_file" "\$tmp_dir"
          readelf -A "\$tmp_dir/usr/bin/lofibox" | tee /tmp/lofibox-armhf-attributes.txt
          grep -Eq "Tag_CPU_arch: v6|Tag_CPU_name: \"6\"" /tmp/lofibox-armhf-attributes.txt
          EOF
          sudo chmod +x "$root/work/build-armhf.sh"
          sudo chroot "$root" /bin/bash /work/build-armhf.sh

          mkdir -p package-artifacts
          sudo cp "$root"/work/lofibox_*_armhf.changes package-artifacts/
          sudo cp "$root"/work/lofibox_*_armhf.deb package-artifacts/
          sudo cp "$root"/work/lofibox_*_armhf.buildinfo package-artifacts/
          sudo chown -R "$USER:$USER" package-artifacts

      - name: Validate Package Artifact
        run: |
          chmod +x lofibox-apt/scripts/ci/*.sh
          lofibox-apt/scripts/ci/validate-debian-artifacts.sh \
            --artifacts-dir package-artifacts \
            --architectures armhf \
            --expected-version "${{ needs.prepare.outputs.preview_version }}"

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package-armhf
          if-no-files-found: error
          path: package-artifacts/*

  publish-pages:
    name: Publish Website And APT Repository
    needs:
      - prepare
      - build-amd64-package
      - build-arm64-package
      - build-raspi-armhf-package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check Out APT Repository
        uses: actions/checkout@v4
        with:
          path: lofibox-apt

      - name: Check Out LoFiBox-Zero
        uses: actions/checkout@v4
        with:
          repository: vicliu624/LoFiBox-Zero
          ref: ${{ inputs.source_ref }}
          path: LoFiBox-Zero

      - name: Verify Source Commit
        run: test "$(git -C LoFiBox-Zero rev-parse HEAD)" = "${{ needs.prepare.outputs.source_sha }}"

      - name: Download Debian Package Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: debian-package-*
          path: debian-artifacts
          merge-multiple: true

      - name: Install Publishing Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            aptly \
            apt-utils \
            dpkg-dev \
            gnupg \
            python3

      - name: Import APT Signing Key
        env:
          LOFIBOX_APT_GPG_PRIVATE_KEY: ${{ secrets.LOFIBOX_APT_GPG_PRIVATE_KEY }}
          LOFIBOX_APT_GPG_KEY_ID: ${{ secrets.LOFIBOX_APT_GPG_KEY_ID }}
        run: |
          chmod +x lofibox-apt/scripts/ci/*.sh
          lofibox-apt/scripts/ci/import-apt-signing-key.sh --env-file "$GITHUB_ENV"

      - name: Validate Debian Package Artifacts
        run: |
          chmod +x lofibox-apt/scripts/ci/*.sh
          find debian-artifacts -maxdepth 2 -type f | sort
          lofibox-apt/scripts/ci/validate-debian-artifacts.sh \
            --artifacts-dir debian-artifacts \
            --architectures amd64,arm64,armhf \
            --expected-version "${{ needs.prepare.outputs.preview_version }}" \
            --changes-list "$RUNNER_TEMP/lofibox-changes-files.txt"

      - name: Build Pages Artifact
        env:
          LOFIBOX_APT_GPG_KEY_ID: ${{ secrets.LOFIBOX_APT_GPG_KEY_ID }}
          LOFIBOX_APT_GPG_PASSPHRASE: ${{ secrets.LOFIBOX_APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          suite="${{ needs.prepare.outputs.suite }}"
          signing_key="${LOFIBOX_IMPORTED_GPG_KEY_ID:-$LOFIBOX_APT_GPG_KEY_ID}"
          if [ -z "$signing_key" ]; then
            echo "::error::No APT signing key id is available after importing LOFIBOX_APT_GPG_PRIVATE_KEY."
            exit 1
          fi

          passphrase_args=()
          gpg_sign_args=(--batch --yes --local-user "$signing_key" --detach-sign)
          if [ -n "${LOFIBOX_APT_GPG_PASSPHRASE:-}" ]; then
            passphrase_file="$RUNNER_TEMP/lofibox-apt-gpg-passphrase"
            printf '%s' "$LOFIBOX_APT_GPG_PASSPHRASE" > "$passphrase_file"
            chmod 0600 "$passphrase_file"
            passphrase_args+=(--gpg-passphrase-file "$passphrase_file")
            gpg_sign_args+=(--pinentry-mode loopback --passphrase-file "$passphrase_file")
          fi

          printf 'LoFiBox APT signing probe\n' > "$RUNNER_TEMP/signing-probe.txt"
          if ! gpg "${gpg_sign_args[@]}" --output "$RUNNER_TEMP/signing-probe.sig" "$RUNNER_TEMP/signing-probe.txt"; then
            echo "::error::The imported APT signing key cannot sign non-interactively. If the key is passphrase-protected, add repository secret LOFIBOX_APT_GPG_PASSPHRASE; otherwise export an unprotected CI signing subkey."
            exit 1
          fi

          changes_args=()
          while IFS= read -r changes_file; do
            changes_args+=(--changes "$changes_file")
          done < "$RUNNER_TEMP/lofibox-changes-files.txt"

          chmod +x lofibox-apt/scripts/*.sh LoFiBox-Zero/scripts/*.sh
          lofibox-apt/scripts/build-public-artifact.sh \
            --site lofibox-apt/site \
            --lofibox-zero LoFiBox-Zero \
            --suite "$suite" \
            --component main \
            --architectures amd64,arm64,armhf \
            --output public \
            --repo-name lofibox-preview \
            --origin LoFiBox \
            --label "LoFiBox Preview" \
            --gpg-key "$signing_key" \
            "${passphrase_args[@]}" \
            "${changes_args[@]}"

      - name: Validate Pages And APT Repository Artifact
        run: |
          set -euxo pipefail
          suite="${{ needs.prepare.outputs.suite }}"
          chmod +x lofibox-apt/scripts/*.sh
          lofibox-apt/scripts/validate-pages-artifact.sh --suite "$suite" --require-apt public
          for arch in amd64 arm64 armhf; do
            test -s "public/debian/dists/$suite/main/binary-$arch/Packages"
            grep -q "${{ needs.prepare.outputs.preview_version }}" "public/debian/dists/$suite/main/binary-$arch/Packages"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
